<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家长 AI 课 · 课前准备清单</title><style>
:root{color-scheme:light;--ink:#273e38;--green:#34735d;--muted:#6b7b74}*{box-sizing:border-box}body{margin:0;background:#f5f4ed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}main{max-width:660px;margin:auto;padding:40px 20px 30px}.tag{font-size:12px;letter-spacing:3px;color:var(--green);font-weight:700}h1{font-size:32px;letter-spacing:-1px;line-height:1.3;margin:12px 0}header p{margin:0;color:var(--muted);font-size:15px}.progress-card{margin:26px 0 22px;padding:20px 22px;background:var(--ink);color:white;border-radius:18px}.progress-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{font-size:23px;font-weight:650}.count small{font-size:13px;opacity:.65;font-weight:400}progress{appearance:none;width:100%;height:7px;border:0;border-radius:20px;overflow:hidden;display:block;margin:12px 0;background:#50645d}progress::-webkit-progress-bar{background:#50645d}progress::-webkit-progress-value{background:#c9e7b2;transition:width .2s}progress::-moz-progress-bar{background:#c9e7b2}.status{font-size:13px;color:#d0e0d8}section{background:#fff;border:1px solid #e3e8df;border-radius:18px;margin:12px 0;padding:20px}h2{font-size:17px;display:flex;align-items:center;gap:12px;margin:0 0 10px}.number{display:grid;place-items:center;width:30px;height:30px;flex-shrink:0;background:#edf2e7;border-radius:10px;font-size:13px;color:var(--green)}label{display:flex;gap:12px;align-items:flex-start;padding:12px 8px;border-radius:10px;cursor:pointer;min-height:48px;font-size:15px}label:hover{background:#f7f9f4}input{appearance:none;flex-shrink:0;width:23px;height:23px;border:1.6px solid #b6c5b9;border-radius:7px;margin:1px 0 0;display:grid;place-items:center;background:white;cursor:pointer}input:checked{background:var(--green);border-color:var(--green)}input:checked:after{content:'✓';color:white;font-size:16px;font-weight:700}input:focus-visible{outline:3px solid #b1d29d;outline-offset:3px}label:has(input:checked){color:#718077;background:#f3f7ef}footer{text-align:center;margin-top:24px;color:var(--muted);font-size:12px}button{font:inherit;font-size:13px;color:var(--muted);border:1px solid #ced7cc;border-radius:30px;background:transparent;padding:9px 18px;cursor:pointer;margin-top:12px}button:hover{background:#e9eee2}button:disabled{opacity:.4;cursor:default}@media(max-width:400px){main{padding:28px 16px}h1{font-size:29px}section{padding:17px 14px}label{font-size:14px}}@media print{body{background:white}main{padding:0}section{break-inside:avoid}button,footer{display:none}.progress-card{color:#273e38;background:#edf2e7}.status{color:#273e38}}
</style></head><body><main>
<header><div class="tag">PARENT AI CLASS</div><h1>课前准备清单</h1><p>准备好一项，就轻轻打个勾。<br>带上手机，一起开始家长 AI 课。</p></header>
<div class="progress-card"><div class="progress-top"><span>我的准备进度</span><span class="count"><span id="count">0</span> <small>/ 9 项</small></span></div><progress id="progress" max="9" value="0" aria-label="课前准备完成进度"></progress><div class="status" id="status" role="status" aria-live="polite">一项一项准备，轻松开启 AI 学习。</div></div>
<section><h2><span class="number">01</span>ChatGPT</h2><label><input type="checkbox" id="chat-account"><span>注册 ChatGPT 账号（推荐开通 Plus 会员）</span></label><label><input type="checkbox" id="chat-app"><span>手机安装 ChatGPT App</span></label></section>
<section><h2><span class="number">02</span>学校通知邮箱</h2><label><input type="checkbox" id="school-email"><span>准备接收学校通知的 Gmail 或 Outlook 邮箱</span></label><label><input type="checkbox" id="email-login"><span>准备好邮箱账号及密码</span></label></section>
<section><h2><span class="number">03</span>电子日历</h2><label><input type="checkbox" id="calendar"><span>准备 Google Calendar 或 Outlook Calendar</span></label><label><input type="checkbox" id="calendar-account"><span>建议与学校通知邮箱使用同一账号</span></label></section>
<section><h2><span class="number">04</span>学校相关网站及 App</h2><label><input type="checkbox" id="school-apps"><span>整理学校、幼儿园常用的网站及 App</span></label><label><input type="checkbox" id="school-logins"><span>准备好各平台的登录用户名和密码</span></label></section>
<section><h2><span class="number">05</span>上课设备</h2><label><input type="checkbox" id="phone"><span>手机一部</span></label></section>
<footer><div id="save-note">勾选进度保存在当前浏览器，不会发送给老师。</div><button type="button" id="reset" disabled>重新检查</button></footer>
</main><script>
const key='parent-ai-preclass-v1';
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
const reset=document.getElementById('reset');
function storageUnavailable(){document.getElementById('save-note').textContent='当前浏览器无法保存进度，关闭页面后可能需要重新勾选。'}
try{const saved=JSON.parse(localStorage.getItem(key)||'{}');boxes.forEach(b=>b.checked=Boolean(saved&&saved[b.id]===true));}catch(e){storageUnavailable()}
function render(){const n=boxes.filter(b=>b.checked).length;document.getElementById('count').textContent=n;document.getElementById('progress').value=n;document.getElementById('status').textContent=n===9?'全部准备好了，期待课堂见！':n===0?'一项一项准备，轻松开启 AI 学习。':'已准备 '+n+' 项，还剩 '+(9-n)+' 项。';reset.disabled=n===0}
function save(){try{localStorage.setItem(key,JSON.stringify(Object.fromEntries(boxes.map(b=>[b.id,b.checked]))))}catch(e){storageUnavailable()}render()}
boxes.forEach(b=>b.addEventListener('change',save));reset.addEventListener('click',()=>{if(confirm('要清空所有勾选，重新检查吗？')){boxes.forEach(b=>b.checked=false);save()}});render();
</script></body></html>
